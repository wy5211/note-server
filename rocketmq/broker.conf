# RocketMQ Broker 配置（教学单机版）
# 完整参数见官方文档；这里每一行都值得看一眼注释

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
# 0 = Master（单机教学就一个节点；生产一般 Master-Slave 或 Dledger 集群）
brokerRole = ASYNC_MASTER
# ASYNC_FLUSH=异步刷盘（性能高，宕机丢少量消息）；SYNC_FLUSH=同步刷盘（金融级不丢）
# —— 这就是「消息可靠性 vs 吞吐量」的第一课，Phase 1 会展开
flushDiskType = ASYNC_FLUSH

# NameServer 地址（compose 内部网络用容器名互通）
namesrvAddr = note-mq-namesrv:9876

# ⚠️ 全文件最关键的一行，RocketMQ 本地开发的经典天坑：
# Broker 启动时会把自己「对外公布的地址」注册到 NameServer，
# 默认公布的是容器内部 IP（172.17.x.x），宿主机上的 Spring 应用拿到这个地址根本连不上，
# 症状：发送消息报 connect to <172.17.x.x>:10911 failed。
# 解法：手动公布一个「宿主机应用和容器网络都可达」的地址 —— 你 Mac 的局域网 IP。
# 副作用：换了 WiFi / 网络环境 IP 变了要来这里改（宿主机 IP 用 `ipconfig getifaddr en0` 查）。
brokerIP1 = 172.172.105.126

# 过期消息自动清理：凌晨 4 点删 48 小时前的消息（教学环境够用）
deleteWhen = 04
fileReservedTime = 48

# 允许发消息时自动创建 Topic（省事）。
# 生产环境一定关掉 + Topic 手工申请管控 —— 乱建 Topic 是大厂 MQ 治理的常见红线
autoCreateTopicEnable = true

listenPort = 10911
